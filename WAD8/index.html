<!DOCTYPE html>
<html>
<head>

    <title>jQuery Mobile Website</title>

    <!-- jQuery Mobile CSS -->
    <link rel="stylesheet"
    href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

    <!-- jQuery Mobile JS -->
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

</head>

<body>

    <!-- Home Page -->

    <div data-role="page" id="home">

        <!-- Header -->
        <div data-role="header">

            <h1>My Mobile Website</h1>

        </div>

        <!-- Content -->
        <div data-role="content">

            <h2>Welcome</h2>

            <p>This is a simple mobile website using jQuery Mobile.</p>

            <!-- Button -->
            <a href="#about" 
               data-role="button">
               Go to About Page
            </a>

        </div>

        <!-- Footer -->
        <div data-role="footer">

            <h4>Home Page</h4>

        </div>

    </div>

    <!-- About Page -->

    <div data-role="page" id="about">

        <!-- Header -->
        <div data-role="header">

            <h1>About</h1>

        </div>

        <!-- Content -->
        <div data-role="content">

            <p>This page is created using jQuery Mobile.</p>


            <a href="#home" 
               data-role="button">
               Back to Home
            </a>

        </div>

        <!-- Footer -->
        <div data-role="footer">

            <h4>About Page</h4>

        </div>

    </div>

</body>
</html>
