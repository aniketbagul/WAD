<!DOCTYPE html>
<html>
<head>
    <title>Simple Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            margin:0;
            background:#f4f4f4;
        }

        .sidebar{
            width:220px;
            height:100vh;
            background:black;
            color:white;
            position:fixed;
            padding:20px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            margin:15px 0;
        }

        .main{
            margin-left:240px;
            padding:20px;
        }

        .card{
            border-radius:10px;
        }

        .graph-box{
            background:white;
            padding:20px;
            margin-top:30px;
            border-radius:10px;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <h3>Dashboard</h3>

        <a href="#">Home</a>
        <a href="#">Students</a>
        <a href="#">Courses</a>
        <a href="#">Exams</a>
        <a href="#">Logout</a>

    </div>

    <!-- Main -->
    <div class="main">

        <h2>College Dashboard</h2>

        <!-- Cards -->
        <div class="row mt-4">

            <div class="col-md-3">
                <div class="card bg-primary text-white p-3">
                    <h4>1200</h4>
                    <p>Students</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-success text-white p-3">
                    <h4>80</h4>
                    <p>Courses</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-danger text-white p-3">
                    <h4>25</h4>
                    <p>Exams</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-warning text-dark p-3">
                    <h4>95%</h4>
                    <p>Results</p>
                </div>
            </div>

        </div>

        <!-- Bar Graph -->
        <div class="graph-box">

    <h4>Marks Graph</h4>

    <canvas id="barChart" height="100"></canvas>

</div>

<!-- Pie Graph -->

    <!-- Bar Chart -->
    <script>

        const bar = document.getElementById("barChart");

        new Chart(bar, {

            type: 'bar',

            data: {
                labels: ['Python', 'Java', 'DBMS', 'AI'],

                datasets: [{
                    label: 'Marks',

                    data: [80, 70, 90, 85],

                    backgroundColor: ['blue', 'green', 'red', 'orange']
                }]
            }

        });

    </script>

</body>
</html>
